# Build the app and publish it to GitHub Pages.
#
# Two settings have to exist before this works, and both are one-off:
#
#   Settings -> Pages -> Source: GitHub Actions
#   Settings -> Secrets and variables -> Actions: VITE_SUPABASE_URL and
#     VITE_SUPABASE_ANON_KEY
#
# The anon key is meant to be read by browsers — it is in the built bundle
# either way, and what protects the data is the row-level security in
# supabase/schema.sql. It lives in secrets here because that is where a build
# reads configuration from, not because it is a secret.

name: Deploy

on:
  push:
    # No remote existed when this was written, and the local branch is master.
    # Both are listed so the first push deploys whichever name it lands on.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push makes an in-flight one pointless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` type-checks on its way through, so this adds the one
      # check it does not do: that the catalogue's lesson and project counts
      # still match the curriculum they describe.
      - run: npm run check:curriculum

      # Articles are what search engines and AI answers read, so what they say about
      # themselves is checked before it is published: description length, FAQ
      # markup, formulas, both languages. Fill blanks too: one inside a square root
      # splits the formula and shows the learner two broken halves.
      - run: npm run check:articles
      - run: npm run check:fill
      # The Chinese-number readings and the converter behind the article: checked
      # against hand-written readings and round-tripped, because a wrong reading on a
      # page that teaches readings does harm.
      - run: npm run check:chinese
      # Exact arithmetic behind the exponents and radicals widgets (simplified roots,
      # rationalised fractions, scientific notation): checked against hand-written
      # values and floating point.
      - run: npm run check:powers
      # The polynomial engine behind the algebraic-expressions widgets (expanding,
      # combining, factoring): checked against hand-written results and against an
      # independent numeric evaluator on random expressions.
      - run: npm run check:algebra
      # The integer engine behind the integers widgets (division conventions,
      # divisibility rules, factorisation, gcd and lcm): checked against hand-written
      # answers, the language operators and brute force.
      - run: npm run check:integers
      # The fraction engine behind the rational-numbers widgets (operations, mixed
      # numbers, when a decimal ends and how it repeats): checked against hand-written
      # answers, float arithmetic and long division.
      - run: npm run check:rationals
      # Integer roots, a + b√m arithmetic, digits of π, e, √2 and φ, and continued
      # fractions behind the irrational-numbers widgets: checked against published
      # values, exhaustive search and floating point.
      - run: npm run check:irrational
      # Base conversion, two's complement, bitwise operators, column arithmetic and
      # fractions in a base behind the binary-numbers widgets: checked against BigInt,
      # the language operators and exact reconstruction.
      - run: npm run check:binary
      # Terms, partial sums, recognition and two-term reconstruction behind the
      # arithmetic-sequence widgets: checked against repeated addition and Gauss pairing.
      - run: npm run check:sequences
      # Terms, finite and infinite sums, recognition and the ratio from two terms behind
      # the geometric-sequence widgets: checked against repeated multiplication and the
      # exact gap to the infinite sum.
      - run: npm run check:geometric
      # Classifying four points, area and symmetry behind the quadrilateral widgets:
      # checked on every school type, under similarities and on random shapes.
      - run: npm run check:quadrilateral
      # Triangle kinds, Heron against the shoelace area, the exact centers and the Euler
      # line, Euclid's triples against brute force, and the law of sines and cosines solvers.
      - run: npm run check:triangle
      # Circles on rational points (Thales, three points, tangents, chords, power of a point),
      # two circles against integer comparisons, sectors, inscribed angles, Archimedes' bounds.
      - run: npm run check:circle
      # Pythagorean triples by Euclid's formula and by factoring against brute force, Berggren's
      # tree, divisibility facts, and exact missing sides and distances.
      - run: npm run check:pythagoras
      # Tangent lines: the slope as a limit against the power rule, the double-root signature of a tangent,
      # outside tangents against a grid of fractions, rational roots, corners, cube-root and cusp quotients.
      - run: npm run check:tangent
      # Derivative functions: the difference quotient as a polynomial in h, reduced derivatives of rational functions
      # and the order of the gap, polynomial division, step functions of polylines and the drawn graphs' derivatives.
      - run: npm run check:derivative
      # Differentiation rules: the rules' result against the exact derivative of rational functions, central
      # differences for every expression and step, and the print/parse round trip.
      - run: npm run check:diffrules
      # Rates of change: Sturm roots, motion along a line in exact arithmetic, throws in closed form, marginal cost
      # against the next unit, and the geometric rates against central differences.
      - run: npm run check:rates
      # Trigonometric derivatives: exact Taylor series of sine and cosine, the squeeze and the two limits, degrees giving
      # pi/180, the six derivative formulas against central differences, and the spring.
      - run: npm run check:trig

      # The chain rule: the differentiator for composite functions against exact derivatives of rational functions, exact
      # fractional powers, dual numbers, central differences for every expression and step, and the oscillation numbers.
      - run: npm run check:chain

      # Implicit differentiation: curves around a known function against exact derivatives, twenty curves against Newton's
      # method and central differences for y' and y'', the chapter's examples and the rational power rule.
      - run: npm run check:implicit

      # Inverses and logarithms: the rule for inverses against differences of numerical inverses, ln and a^x from their
      # definitions, and the limits for e and ln a.
      - run: npm run check:inverse

      # Inverse trigonometric functions: the six against the trigonometric ones and the rule for inverses, the identities, the
      # reference triangles and the viewing angle against a scan.
      - run: npm run check:invtrig

      # Related rates: the textbook's six answers, the chain rule by hand with central-difference partial derivatives, a
      # simulation with the quantities moving in time, and values worked out from the equation.
      - run: npm run check:relatedrates

      # Linearization and differentials: the textbook's values, the error against the second-derivative estimate, the best linear
      # approximation, differentials against real changes, and percentage errors against exact powers.
      - run: npm run check:linearize

      # The C++ program in each article: it runs in the interpreter of the C++ course and prints exactly the output shown.
      - run: npm run check:articlecpp

      # Extreme values on a closed interval: the textbook's examples, a scan of a million points, the First Derivative Theorem,
      # the cases of the Extreme Value Theorem and the box of the exercises.
      - run: npm run check:extrema

      # The Mean Value Theorem: the textbook's c worked out by hand, six hundred random functions against a scan and the proof's auxiliary
      # function, the cases of Rolle's Theorem, zeros of a polynomial and of its derivative, and the families y = g(x) + C.
      - run: npm run check:mvt

      # The text of a formula as TeX, for the preset buttons of the widgets: exact cases for powers, products, fractions and functions.
      - run: npm run check:exprtex

      # Monotonic functions and the First Derivative Test: the textbook's examples by hand, random polynomials against exact roots and a scan,
      # derivatives built from their factors, the patterns of the test, Corollary 3, and inequalities proved by monotonicity.
      - run: npm run check:monotone

      # Concavity and curve sketching: the textbook's seven examples and five graphs by hand, inflection points against exact roots of f'',
      # the Second Derivative Test against the First, and asymptotes of rational functions in closed form.
      - run: npm run check:concavity

      # Indeterminate forms and l'Hopital's Rule: the textbook's examples against SymPy limits, the rule round by round, cycles and missing limits,
      # products, differences and powers, Cauchy's Mean Value Theorem against a scan, and the TeX of every answer.
      - run: npm run check:lhopital

      # Applied optimization: the textbook's fifteen problems against SymPy and a scan, closed forms of the box, can, fence, rectangle and delivery
      # schedule at random, Snell's law against a ternary search, and marginal revenue = marginal cost against a scan of the profit.
      - run: npm run check:optimize

      # Newton's method: the textbook's tables and exercises, roots against mpmath, the order of convergence, the closed forms of square roots and
      # reciprocals, the failures (cycle, escape, flat tangent, wrong root), and the basins of attraction against a plain loop.
      - run: npm run check:newton

      # Floating-point numbers: the bits of doubles against DataView, single precision against Math.fround, half precision, neighbours and
      # decimals against Python, every number of small formats against the definition, sums and cancellation.
      - run: npm run check:floatbits

      - name: Work out where the site will live
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          # A site with its own domain is served at the domain root, and public/CNAME is where the
          # repository says which domain that is. It is the same file GitHub Pages reads, so the build
          # and the Pages setting cannot disagree.
          domain=""
          if [ -s public/CNAME ]; then domain="$(tr -d '[:space:]' < public/CNAME)"; fi
          if [ -n "$domain" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "site=https://$domain" >> "$GITHUB_OUTPUT"
          # A repository named <user>.github.io is served at the domain root;
          # anything else is a project site under /<repo>/.
          elif [[ "$repo" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to build with keys that would not work
        # Missing them is not an error — the app falls back to local mode, where
        # accounts live in one browser and nothing is shared. That is right for
        # `npm run dev` and wrong for a published site, which would look
        # perfectly fine and quietly store nothing. So it is caught here.
        #
        # The inputs are checked rather than the output: `supabase.co` appears
        # in the bundle either way, because the client library carries it.
        #
        # Shape is checked as well as presence, because presence alone let a
        # broken deploy through once. A secret holding a whole .env line —
        # `VITE_SUPABASE_URL=https://…` instead of `https://…` — is not empty,
        # so it built cleanly, and then supabase-js threw on the very first
        # render. React unmounted, and the published site was a blank page with
        # the reason visible only in the browser console.
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Plain ifs, not `[ ... ] && ...`: steps run under `bash -e`, and a
          # test that comes back false would end the step with a failure when
          # everything was in fact fine. `case` is safe the same way — no match
          # is a success, and so is an empty branch.
          missing=""
          if [ -z "$URL" ]; then missing="VITE_SUPABASE_URL"; fi
          if [ -z "$KEY" ]; then missing="$missing VITE_SUPABASE_ANON_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Empty:$missing. Two things make this happen. Either the secret is not there — check the exact name under Settings -> Secrets and variables -> Actions -> Repository secrets, and note that names are case-sensitive and an *environment* secret would not be visible to this job. Or this run simply started before the secret existed: a run reads secrets when it runs, not when the commit was pushed, so re-run it."
            exit 1
          fi

          # A secret holds only the value. Copying a line out of .env brings the
          # name along with it, and nothing downstream would notice.
          named=""
          case "$URL" in VITE_*) named="VITE_SUPABASE_URL" ;; esac
          case "$KEY" in VITE_*) named="$named VITE_SUPABASE_ANON_KEY" ;; esac
          if [ -n "$named" ]; then
            echo "::error::Prefixed:$named. The value begins with its own name, so the secret holds a whole .env line rather than the value. Edit each one under Settings -> Secrets and variables -> Actions and paste only what follows the '=' — no name, no quotes, no trailing spaces."
            exit 1
          fi

          case "$URL" in
            https://*) ;;
            *)
              echo "::error::VITE_SUPABASE_URL does not begin with https://, so supabase-js rejects it on the first render and the published site is blank. Copy it from Supabase -> Project Settings -> Data API -> Project URL. A quote or a stray space at the front is enough to land here."
              exit 1
              ;;
          esac

          # This value is read by every visitor's browser; that is what the anon
          # key is for, and row-level security is what stands behind it. A
          # service-role key bypasses row-level security entirely, so publishing
          # one would hand every visitor the whole database.
          bad_key=""
          case "$KEY" in sb_secret_*) bad_key="yes" ;; esac
          if printf '%s' "$KEY" | grep -q '^eyJ'; then
            role=$(node -e 'const p=process.argv[1].split(".")[1]||"";try{console.log(JSON.parse(Buffer.from(p,"base64url").toString()).role||"")}catch{console.log("")}' "$KEY" || true)
            if [ "$role" = "service_role" ]; then bad_key="yes"; fi
          fi
          if [ -n "$bad_key" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is a service-role key, and this one ends up in a file every visitor downloads. Use the publishable or anon key instead (sb_publishable_… or a JWT whose role is anon), and rotate the key that was pasted here — treat it as leaked."
            exit 1
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
          # The public address: the domain in public/CNAME when there is one, else the optional
          # SITE_URL variable, else it is worked out from the repository (user.github.io/repo).
          SITE_URL: ${{ steps.base.outputs.site || vars.SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
